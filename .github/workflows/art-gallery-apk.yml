name: Build and Publish Art Gallery APK

on:
  push:
    branches:
      - art-gallery-apk-build
    paths:
      - "art-gallery-android/**"
      - ".github/workflows/art-gallery-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: art-gallery-android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp art-gallery-android/app/build/outputs/apk/debug/app-debug.apk ArtGallery.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete artgallery-v1.0 --cleanup-tag -y || true
          gh release create artgallery-v1.0 ArtGallery.apk --title "Art Gallery v1.0" --notes "Android APK for Art Gallery"
