name: Build and Publish Rangin Gallery APK

on:
  push:
    branches:
      - art-gallery-apk-build
    paths:
      - "art-gallery-android/**"
      - ".github/workflows/art-gallery-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Android signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artgallery-stable-debug-keystore-v1

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: art-gallery-android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp art-gallery-android/app/build/outputs/apk/debug/app-debug.apk Rangin-Gallery-v3.0.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rangin-gallery-v3.0 --cleanup-tag -y || true
          gh release create rangin-gallery-v3.0 Rangin-Gallery-v3.0.apk --title "Rangin Gallery v3.0" --notes "Persian-inspired visual redesign, English app name, and full English/Spanish/Persian interface with first-run language selection. Built on the stable signing baseline for in-place updates."
