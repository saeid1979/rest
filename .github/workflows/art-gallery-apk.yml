name: Build and Publish Art Gallery APK

on:
  push:
    branches:
      - art-gallery-apk-build
    paths:
      - "art-gallery-android/**"
      - ".github/workflows/art-gallery-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Android signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artgallery-stable-debug-keystore-v1

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: art-gallery-android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp art-gallery-android/app/build/outputs/apk/debug/app-debug.apk ArtGallery-v2.1-STABLE.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete artgallery-v2.1-stable --cleanup-tag -y || true
          gh release create artgallery-v2.1-stable ArtGallery-v2.1-STABLE.apk --title "Art Gallery v2.1 Stable" --notes "Stable signing baseline. One-time reinstall is required if an older build was signed with a different temporary key. Future versions built from this workflow can update in place."
